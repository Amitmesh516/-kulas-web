<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Confirmed — Kulas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --grey: #888888;
      --accent: #ffffff;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle background watermark like the main site */
    body::before {
      content: 'Kulas';
      position: fixed;
      font-family: 'Playfair Display', serif;
      font-size: clamp(120px, 30vw, 320px);
      font-weight: 700;
      color: rgba(255,255,255,0.03);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      white-space: nowrap;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--white);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 3rem;
      opacity: 0.9;
    }

    .checkmark {
      width: 72px;
      height: 72px;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      animation: popIn 0.5s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    .checkmark svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    h1 em {
      font-style: italic;
      color: var(--white);
    }

    p {
      font-size: 1rem;
      font-weight: 300;
      color: var(--grey);
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-block;
      background: var(--white);
      color: var(--black);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: opacity 0.2s, transform 0.2s;
      margin-bottom: 1rem;
    }

    .btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
      opacity: 1;
    }

    .hint {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
      margin-bottom: 0;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
      z-index: 1;
    }

    footer a {
      color: rgba(255,255,255,0.35);
      text-decoration: none;
    }

    footer a:hover { color: var(--white); }
  </style>
</head>
<body>
  <div class="container">
    <a href="https://kulas.app" class="logo">Kulas</a>

    <div class="checkmark">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 16L13 23L26 9" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>You're <em>confirmed</em></h1>
    <p>Your email has been verified.<br/>Head back to Kulas to start planning your trip.</p>

    <a href="com.amit.kulas://login-callback" class="btn">Open Kulas</a>
    <p class="hint">Or open the Kulas app manually on your device.</p>
  </div>

  <footer>
    <a href="https://kulas.app">kulas.app</a> &nbsp;·&nbsp;
    <a href="https://kulas.app/privacy.html">Privacy</a>
  </footer>
</body>
</html>
