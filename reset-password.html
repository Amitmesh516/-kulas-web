<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Kulas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; margin-top: 20px; }
    input[type="password"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input[type="password"]:focus { border-color: #555; }
    button {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      padding: 15px;
      margin-top: 28px;
      cursor: pointer;
      transition: opacity 0.2s;
      -webkit-appearance: none;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .error-msg {
      margin-top: 20px;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
      color: #ff5f5f;
      display: none;
    }
    .success-section { display: none; text-align: center; padding: 20px 0; }
    .success-icon { font-size: 40px; margin-bottom: 16px; }
    .success-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .success-sub { color: #888; font-size: 14px; }
    .footer { margin-top: 32px; font-size: 13px; color: #444; text-align: center; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid #333; border-top-color: #000;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">Kulas</div>
  <div class="subtitle">Enter your new password below.</div>

  <div id="formSection">
    <label for="password">New Password</label>
    <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" />

    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" placeholder="Same password again" autocomplete="new-password" />

    <button id="submitBtn" onclick="handleSubmit()">Update Password</button>
  </div>

  <div class="success-section" id="successSection">
    <div class="success-icon">✓</div>
    <div class="success-title">Password updated!</div>
    <div class="success-sub">Open the Kulas app to log in with your new password.</div>
  </div>

  <div class="error-msg" id="errorMsg"></div>
</div>

<div class="footer">kulas.app</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://rablztecjaizsochyyer.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_q_H-bs_Bj7PM-s3xOydhTA_hjeeaEDt';
  const FIFTEEN_MINS = 15 * 60 * 1000;

  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_KEY);

  function jwtIssuedAt(token) {
    try {
      const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      return payload.iat ? payload.iat * 1000 : null;
    } catch { return null; }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  window.onload = async function () {
    const btn = document.getElementById('submitBtn');

    // Implicit flow: #access_token=... (sent by the Flutter app)
    const hash = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = hash.get('access_token');
    const refreshToken = hash.get('refresh_token') || '';

    if (!accessToken) {
      showError('This link is invalid or has expired. Please request a new password reset.');
      btn.disabled = true;
      return;
    }

    // Enforce 15-minute expiry based on when the token was issued
    const iat = jwtIssuedAt(accessToken);
    if (iat && Date.now() - iat > FIFTEEN_MINS) {
      showError('This link has expired (links are valid for 15 minutes). Please request a new password reset.');
      btn.disabled = true;
      return;
    }

    // Set the session so updateUser works
    const { error } = await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
    if (error) {
      showError('This link is invalid or has expired. Please request a new password reset.');
      btn.disabled = true;
    }
  };

  async function handleSubmit() {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const btn = document.getElementById('submitBtn');

    document.getElementById('errorMsg').style.display = 'none';

    if (!password || password.length < 6) { showError('Password must be at least 6 characters.'); return; }
    if (password !== confirm) { showError("Passwords don't match. Please try again."); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Updating...';

    try {
      const { error } = await client.auth.updateUser({ password });
      if (error) throw error;
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('successSection').style.display = 'block';
    } catch (err) {
      showError(err.message?.includes('expired') ? 'This link has expired. Please request a new password reset.' : 'Something went wrong. Please try again.');
      btn.disabled = false;
      btn.innerHTML = 'Update Password';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });
</script>

</body>
</html>
